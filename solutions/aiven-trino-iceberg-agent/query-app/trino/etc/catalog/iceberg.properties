# Iceberg catalog backed by Snowflake Open Catalog (Iceberg REST catalog).
#
# Secrets are NOT baked in: Trino expands ${ENV:VAR} from environment variables
# at startup, so these come from Aiven Apps env vars / secrets (see .env.example).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_CATALOG_URI}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:ICEBERG_OAUTH_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=${ENV:ICEBERG_OAUTH_SCOPE}
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}
# Open Catalog vends temporary S3 credentials to Trino, so Trino needs no AWS keys.
iceberg.rest-catalog.vended-credentials-enabled=true

# Cross-region (Path A): Trino runs in eu-west-1 but the bucket is us-west-2.
# The S3 region MUST follow the data (the bucket), not the compute — otherwise
# every S3 call returns 301 PermanentRedirect.
fs.native-s3.enabled=true
s3.endpoint=https://s3.us-west-2.amazonaws.com
s3.region=us-west-2
s3.path-style-access=true
