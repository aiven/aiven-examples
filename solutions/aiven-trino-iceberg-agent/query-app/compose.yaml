# query-app: Trino + co-located Trino MCP server, as ONE deployable service.
#
# Both processes run in a single image (see Dockerfile) because Aiven Apps deploys
# one buildable service per app — no pre-built image pull, no multi-service
# compose, no bind-mount volumes. The Trino config is baked into the image; only
# the MCP endpoint (/mcp on :9097) is exposed. All secrets are injected via
# environment variables (Aiven Apps env/secrets; local .env) — see .env.example.
# Nothing sensitive is baked into the config files or image.

services:
  query-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: query-app
    container_name: query-app
    environment:
      # --- Trino -> Snowflake Open Catalog (expanded by Trino's ${ENV:...}) ---
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_OAUTH_CREDENTIAL: ${ICEBERG_OAUTH_CREDENTIAL}
      ICEBERG_OAUTH_SCOPE: ${ICEBERG_OAUTH_SCOPE}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      # --- Auth on the exposed MCP endpoint (HMAC-signed JWT) ---
      # Local dev: leave MCP_OAUTH_ENABLED=false. For the exposed Aiven Apps
      # deployment set it true and provide a strong MCP_JWT_SECRET; query-agent
      # presents a JWT signed with the same secret.
      OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      OAUTH_MODE: native
      OAUTH_PROVIDER: hmac
      JWT_SECRET: ${MCP_JWT_SECRET:-}
      # The HMAC validator REQUIRES an audience (and issuer); without OIDC_AUDIENCE
      # it logs "audience is required" and rejects all tokens. query-agent must mint
      # JWTs whose aud/iss claims match these exact values.
      OIDC_AUDIENCE: ${MCP_JWT_AUDIENCE:-trino-mcp}
      OIDC_ISSUER: ${MCP_JWT_ISSUER:-aiven-query-agent}
      # Trino wiring (TRINO_HOST/PORT/SCHEME/USER/CATALOG, MCP_TRANSPORT/PORT) has
      # image defaults — see Dockerfile. Override here only if you change them.
    # The only externally-reachable surface (consumed by query-agent).
    # Trino's 8080 stays container-internal; to debug it locally, add "8080:8080".
    ports:
      - "9097:9097"
    restart: unless-stopped
