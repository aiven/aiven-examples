# query-agent: web chat (FastAPI + Strands + Amazon Bedrock) over the Trino MCP.
#
# All config via environment variables (Aiven Apps env/secrets; local .env).
# Nothing sensitive is baked into the image — the Bedrock keys generated by
# setup-bedrock.sh are supplied here at runtime.

services:
  query-agent:
    build:
      context: .
      dockerfile: Containerfile
    image: query-agent
    container_name: query-agent
    environment:
      # --- Amazon Bedrock (see setup-bedrock.sh) ---
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-eu.anthropic.claude-sonnet-4-6}
      # --- Trino MCP endpoint (from query-app) ---
      TRINO_MCP_URL: ${TRINO_MCP_URL:-http://localhost:9097/mcp}
      TRINO_MCP_JWT: ${TRINO_MCP_JWT:-}
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
