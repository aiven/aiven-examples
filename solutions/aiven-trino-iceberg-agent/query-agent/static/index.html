<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>query-agent — ask the live orders</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a2029; --accent:#ff5c35; --text:#e6e6e6; --muted:#8a94a6; --code:#0b0e13; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; border-bottom:1px solid #2a313c; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    /* Activity toggle */
    .toggle { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap; cursor:pointer; user-select:none; }
    .toggle input { position:absolute; opacity:0; width:0; height:0; }
    .track { width:34px; height:18px; border-radius:9px; background:#2a313c; position:relative; transition:background .15s; flex:none; }
    .track::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#8a94a6; transition:transform .15s, background .15s; }
    .toggle input:checked + .track { background:var(--accent); }
    .toggle input:checked + .track::after { transform:translateX(16px); background:#fff; }
    #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .msg { max-width:820px; padding:12px 16px; border-radius:10px; line-height:1.5; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--accent); color:#fff; }
    .bot { align-self:flex-start; background:var(--panel); }
    .err { align-self:flex-start; background:#3a1d1d; color:#ffb4a8; }
    .msg .ts { font-size:10px; margin-top:6px; color:var(--muted); }
    .user .ts { color:rgba(255,255,255,.75); text-align:right; }
    .sql { align-self:flex-start; max-width:820px; width:100%; }
    .sql details { background:var(--code); border:1px solid #2a313c; border-radius:8px; padding:8px 12px; }
    .sql summary { cursor:pointer; color:var(--muted); font-size:12px; }
    .sql pre { margin:8px 0 0; overflow-x:auto; font-size:12.5px; color:#9ed0ff; }
    .tool { color:var(--muted); font-size:11px; margin-top:6px; }
    /* Live activity trace — only shown when the toggle is on (body.show-activity). */
    .activity { align-self:flex-start; max-width:820px; width:100%; display:none;
                background:var(--code); border:1px solid #2a313c; border-radius:8px; padding:10px 14px; }
    body.show-activity .activity:not(:empty) { display:block; }
    .activity .head { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;
                      display:flex; align-items:center; gap:8px; }
    .activity .line { font-size:12.5px; color:#cdd6e3; padding:3px 0; display:flex; gap:8px; align-items:baseline; }
    .activity .line .ic { color:var(--accent); }
    .activity.running .head .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid #2a313c; }
    input { flex:1; padding:12px 14px; border-radius:8px; border:1px solid #2a313c; background:var(--panel); color:var(--text); font-size:14px; }
    button { padding:12px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🔎 query-agent</h1>
      <p>Ask in plain English about the live orders — the agent writes the SQL and runs it on Trino.</p>
    </div>
    <label class="toggle" title="Show what the agent is doing while it works">
      <input id="activityToggle" type="checkbox" />
      <span class="track"></span>
      <span>Show activity</span>
    </label>
  </header>
  <div id="log">
    <div class="msg bot">Try: “How many orders in the last hour?” · “Top 5 products by total revenue” · “Average order amount by status”</div>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about the orders…" />
    <button id="send" type="submit">Ask</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const activityToggle = document.getElementById("activityToggle");

    // --- Activity toggle, persisted across reloads ---
    const SHOW_KEY = "qa.showActivity";
    function applyToggle(on) {
      document.body.classList.toggle("show-activity", on);
      activityToggle.checked = on;
    }
    applyToggle(localStorage.getItem(SHOW_KEY) === "1");
    activityToggle.addEventListener("change", () => {
      localStorage.setItem(SHOW_KEY, activityToggle.checked ? "1" : "0");
      applyToggle(activityToggle.checked);
    });

    // Friendly names for the MCP tools the agent calls.
    const TOOL_LABELS = {
      list_schemas: "Listing schemas",
      list_tables: "Listing tables",
      get_table_schema: "Inspecting table schema",
      execute_query: "Running SQL query",
    };
    const friendly = (name) => TOOL_LABELS[name] || name;

    function fmtTime(d) {
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      const ts = document.createElement("div");
      ts.className = "ts";
      ts.textContent = fmtTime(new Date());
      d.appendChild(body);
      d.appendChild(ts);
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    // A live activity panel for one turn. Always created (cheap); CSS hides it
    // unless the toggle is on, so flipping the toggle reveals past traces too.
    function makeActivity() {
      const el = document.createElement("div");
      el.className = "activity running";
      const head = document.createElement("div");
      head.className = "head";
      head.innerHTML = '<span class="dot"></span><span>Activity</span>';
      el.appendChild(head);
      log.appendChild(el);
      return {
        line(text) {
          const l = document.createElement("div");
          l.className = "line";
          l.innerHTML = '<span class="ic">▸</span>';
          const t = document.createElement("span");
          t.textContent = text;
          l.appendChild(t);
          el.appendChild(l);
          log.scrollTop = log.scrollHeight;
        },
        finish() { el.classList.remove("running"); },
      };
    }

    function addSql(calls) {
      if (!calls || !calls.length) return;
      const wrap = document.createElement("div");
      wrap.className = "sql";
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = `SQL / tools the agent ran (${calls.length})`;
      det.appendChild(sum);
      for (const c of calls) {
        const label = document.createElement("div");
        label.className = "tool";
        label.textContent = "▸ " + (c.tool || "tool");
        det.appendChild(label);
        if (c.sql) {
          const pre = document.createElement("pre");
          pre.textContent = c.sql;
          det.appendChild(pre);
        }
      }
      wrap.appendChild(det);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      add("user", q);
      input.value = "";
      send.disabled = true;

      const activity = makeActivity();
      const bot = add("bot", "Thinking…");
      const botBody = bot.querySelector(".body");
      let answer = "";

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q }),
        });
        if (!res.ok || !res.body) throw new Error("Request failed: " + res.status);

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        let errored = false;

        const handle = (evt) => {
          if (evt.type === "status") {
            activity.line(evt.text);
          } else if (evt.type === "tool") {
            activity.line(friendly(evt.name));
          } else if (evt.type === "token") {
            answer += evt.text;
            botBody.textContent = answer;
            log.scrollTop = log.scrollHeight;
          } else if (evt.type === "done") {
            answer = evt.answer || answer || "(no answer)";
            botBody.textContent = answer;
            bot.querySelector(".ts").textContent = fmtTime(new Date());
            activity.finish();
            addSql(evt.tool_calls);
          } else if (evt.type === "error") {
            errored = true;
            bot.remove();
            activity.finish();
            add("err", evt.error);
          }
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const frame = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const dataLine = frame.split("\n").find((l) => l.startsWith("data:"));
            if (dataLine) handle(JSON.parse(dataLine.slice(5).trim()));
          }
        }
        if (!errored && answer === "") {
          botBody.textContent = "(no answer)";
          activity.finish();
        }
      } catch (err) {
        bot.remove();
        activity.finish();
        add("err", String(err));
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
