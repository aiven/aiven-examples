# Raw MQTT/TCP — for local dev and same-network clients.
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets — the listener to expose on Aiven Apps. The Apps
# ingress is HTTP(S)-only (TLS-terminated), so raw MQTT/TCP does not pass
# through it; WebSocket upgrades do. Clients connect with wss://<host>:443.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
