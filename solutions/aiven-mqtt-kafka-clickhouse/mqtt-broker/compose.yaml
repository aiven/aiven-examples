# mqtt-broker: Eclipse Mosquitto with password auth (long-running service).
#
# Credentials are generated from env vars at container startup — nothing
# sensitive is baked into the image and no bind mounts are needed.
#
# Two listeners: 1883 (raw MQTT, local dev) and 9001 (MQTT over
# WebSockets). On Aiven Apps expose port 9001 — the Apps ingress is
# HTTP(S)-only, so external clients (publisher, Kafka Connect MQTT
# source) must connect via WebSockets: wss://<app-hostname>:443.

services:
  mqtt-broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: mqtt-broker
    container_name: mqtt-broker
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-iot}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-data:
