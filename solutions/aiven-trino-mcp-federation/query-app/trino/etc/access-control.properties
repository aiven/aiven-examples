# Built-in read-only system access control: permits SELECT and metadata reads,
# denies all writes/DDL (INSERT, UPDATE, DELETE, CREATE, DROP, ...).
#
# This is how query-app stays read-only: the Trino MCP server (mcp-trino) has no
# read-only mode of its own and runs arbitrary SQL via execute_query, so the
# guarantee is enforced here at the engine. See PLAN-SIMPLIFIED.md §8 item 3.
access-control.name=read-only
