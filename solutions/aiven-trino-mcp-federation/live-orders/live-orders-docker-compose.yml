# live-orders: continuous Kafka order producer (long-running worker).
#
# Pure producer — no inbound port. All config via environment variables
# (Aiven Apps env/secrets; local .env). Nothing sensitive is baked into the image.

services:
  live-orders:
    build:
      context: .
      dockerfile: Containerfile
    image: live-orders
    container_name: live-orders
    environment:
      KAFKA_SERVICE_URI: ${KAFKA_SERVICE_URI}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-order}
      ORDERS_PER_MINUTE: ${ORDERS_PER_MINUTE:-100}
    restart: unless-stopped
