spring:
  application:
    name: ingest-service
  # JDBC pools are built explicitly in ClickHouseJdbcConfig from the
  # clickhouse.* block below (main pool + async_insert pool for tiers 2-3), so
  # local Docker <-> Aiven is a profile/env switch only - no code changes.
  threads:
    virtual:
      enabled: true   # Java 25: no synchronized pinning (JEP 491); used by tier 3 + the REST receiver

# CLI aliases: --tier=1..6 (ladder) or --tier=0 (buffered REST pipeline), --rows=N,
# --concurrency=N (tier 3, default 80), --batch-size=N (tiers 4-6 and 0),
# --format=RowBinary|JSONEachRow (tiers 5-6), --writers=N (tier 6),
# --buffer-capacity=N / --flush-interval-ms=N (tier 0).
ingest:
  tier: ${tier:-1}
  rows: ${rows:100000}
  seed: ${seed:42}
  concurrency: ${concurrency:1}
  batch-size: ${batch-size:10000}
  format: ${format:RowBinary}
  writers: ${writers:4}
  buffer-capacity: ${buffer-capacity:100000}
  flush-interval-ms: ${flush-interval-ms:1000}
  # When set, every endpoint except /actuator/health requires this value in an
  # X-API-Key header (see ApiKeyFilter). Always set it on public deploys.
  api-key: ${INGEST_API_KEY:}
  # What backs POST /events: "memory" = the in-memory buffer (default;
  # zero dependencies, dies with the app), "valkey" = Valkey Streams - the
  # durable post-ladder production architecture (XADD -> consumer-group
  # flusher -> native-client bulk insert, runtime-tunable via PUT /config).
  buffer: ${buffer:${INGEST_BUFFER:memory}}
  # Valkey write semantics (valkey mode only):
  #   valkey-ack:  sync    = 202 AFTER Valkey acknowledges (durable handshake)
  #                async   = 202 immediately, failures counted in
  #                          valkey.sink.async_failures (fire-and-forget)
  #   valkey-send: direct  = XADD per request (pipelined within a request)
  #                batched = Kafka-producer-style accumulator: one pipelined
  #                          flush per send-batch events or send-linger-ms
  #                          (implies fire-and-forget for the linger window)
  valkey-ack: ${INGEST_VALKEY_ACK:sync}
  valkey-send: ${INGEST_VALKEY_SEND:direct}
  send-batch: ${INGEST_SEND_BATCH:512}
  send-linger-ms: ${INGEST_SEND_LINGER_MS:2}

# Valkey Streams buffer (only read when ingest.buffer=valkey).
valkey:
  uri: ${VALKEY_URI:redis://localhost:6379}
  stream: ingest:events
  group: clickhouse-flushers
  # Must be unique per app instance; defaults to the hostname (= pod name on
  # containers), which is exactly the uniqueness the consumer group needs.
  consumer: ${VALKEY_CONSUMER:}
  # A dead instance's pending entries are reclaimed by a survivor after this.
  claim-min-idle-ms: 30000
  # Flusher worker threads per instance (each its own consumer in the group).
  # 1 = the tier 5 single-stream insert path; >1 = the tier 6 parallel-writers
  # pattern inside one instance. Horizontal instances scale the same way.
  flushers: ${VALKEY_FLUSHERS:1}
  # Backpressure bound: POST /events returns 429 once XLEN passes this
  # (ClickHouse outage / flushers behind), instead of filling Valkey's memory.
  max-stream-length: 1000000

clickhouse:
  host: localhost
  port: 8123
  ssl: false
  database: campaign_analytics
  username: default
  password: "local"   # matches CLICKHOUSE_PASSWORD in docker-compose.yml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # Push metrics as OTLP to an OpenTelemetry Collector, which remote-writes
  # into Aiven for Metrics (Thanos). Off by default; enable with
  # OTLP_METRICS_ENABLED=true and point OTEL_EXPORTER_OTLP_ENDPOINT at the
  # collector (e.g. http://otel-collector:4318).
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  opentelemetry:
    resource-attributes:
      service.name: ingest-service

---
# Aiven for ClickHouse. Set via env:
#   AIVEN_CH_HOST=<service>-<project>.aivencloud.com
#   AIVEN_CH_PORT=<https port, usually the 8443-equivalent shown in the console>
#   AIVEN_CH_PASSWORD=<avnadmin password>
spring:
  config:
    activate:
      on-profile: aiven

clickhouse:
  host: ${AIVEN_CH_HOST}
  port: ${AIVEN_CH_PORT:8443}
  ssl: true
  database: ${AIVEN_CH_DATABASE:campaign_analytics}
  username: ${AIVEN_CH_USER:avnadmin}
  password: ${AIVEN_CH_PASSWORD}

# Aiven for Valkey (same region as ClickHouse - terraform output -raw valkey_uri).
# Only used when INGEST_BUFFER=valkey; rediss:// / valkeys:// = TLS.
valkey:
  uri: ${AIVEN_VALKEY_URI:${VALKEY_URI:redis://localhost:6379}}
